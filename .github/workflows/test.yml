name: Bot tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24.18.0'
      - name: Run native tests including Windows secret protection
        run: node --test --test-reporter=spec test/*.test.ts
      - name: Check TypeScript syntax
        run: node tools/check.ts
